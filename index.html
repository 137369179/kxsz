<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- SEO + 社交分享 -->
  <meta name="description" content="凯茜识字 — 专业儿童 1:1 游戏化汉字启蒙与分级阅读应用，让孩子在游戏中快乐认字。" />
  <meta property="og:title" content="凯茜识字 - Cathy Literacy" />
  <meta property="og:description" content="专业儿童汉字启蒙与分级阅读，沉浸式游戏化学习体验" />
  <meta property="og:image" content="assets/images/cathy_mascot.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="凯茜识字" />
  <meta name="twitter:description" content="专业儿童汉字启蒙与分级阅读应用" />
  <meta name="twitter:image" content="assets/images/cathy_mascot.jpg" />
  <!-- CSP：限制资源加载来源，防止 XSS，允许本地 AI 语音服务与本地开发连接 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:*; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <link rel="icon" type="image/jpeg" href="assets/images/cathy_mascot.jpg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/images/cathy_mascot.jpg" />
  <title>凯茜识字 (Cathy Literacy) - 1:1 沉浸式汉字启蒙与分级阅读</title>
  <!-- Tailwind CSS (异步加载，避免阻塞页面渲染) -->
  <link rel="preload" href="assets/vendor/tailwindcss.js" as="script">
  <script src="assets/vendor/tailwindcss.js" defer></script>
  <link rel="stylesheet" href="style.css?v=2.7.0" />
  <style>
    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-amber-950 overflow-hidden select-none m-0 p-0 w-screen h-screen flex items-center justify-center">

  <!-- 16:9 横屏游戏全屏主视口 -->
  <div id="game-app-viewport" class="relative w-full h-full max-w-7xl max-h-[768px] aspect-[16/9] bg-sky-400 overflow-hidden shadow-2xl rounded-none sm:rounded-3xl border-0 sm:border-4 sm:border-amber-300">
    <!-- 动态模块（横向大地图、五步学习流、绘本馆、游乐场、字卡库、家长中心）由 app.js 注入 -->
  </div>

  <!-- 移动端竖屏旋转提示遮罩 -->
  <div id="orientation-rotate-prompt" class="fixed inset-0 z-[999] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center text-white select-none hidden">
    <div class="w-24 h-24 mb-6 flex items-center justify-center animate-rotate-phone">
      <img src="assets/images/cathy_mascot.jpg" class="w-20 h-20 rounded-full border-4 border-amber-300 shadow-2xl object-cover" alt="旋转提示" />
    </div>
    <h2 class="text-2xl font-black text-amber-300 mb-2">请旋转手机横屏体验</h2>
    <p class="text-xs text-white/70 max-w-xs leading-relaxed font-bold">
      《凯茜识字》专为 16:9 沉浸式游戏世界设计，横过来看更精彩哦～
    </p>
    <button id="btn-dismiss-rotate-prompt" class="mt-8 bg-white/20 hover:bg-white/30 text-white/90 text-xs font-black px-6 py-2 rounded-full border border-white/30 transition-all">
      保持竖屏体验
    </button>
  </div>

  <!-- 核心逻辑脚本 (带版本防缓存) -->
  <script type="module" src="src/app.js?v=2.7.0"></script>

  <!-- PWA Service Worker 注册与自动热更新 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=2.7.0").then((reg) => {
          reg.update();
        }).catch((err) => {
          console.log("ServiceWorker registration skipped:", err);
        });
      });
    }
  </script>
</body>
</html>
