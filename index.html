  <!-- 早期全局拦截并静默过滤浏览器与扩展插件的异步消息通道报错 (Chrome Extension Port / SpeechRecognition IPC Unhandled Rejection) -->
  <script>
    (function() {
      function isChannelClosedError(msg) {
        if (!msg) return false;
        var s = String(msg);
        return s.indexOf("A listener indicated an asynchronous response") !== -1 ||
               s.indexOf("message channel closed") !== -1 ||
               s.indexOf("Receiving end does not exist") !== -1 ||
               s.indexOf("could not be established") !== -1;
      }

      window.addEventListener("unhandledrejection", function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || "";
        if (isChannelClosedError(msg)) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === "function") {
            event.stopImmediatePropagation();
          }
        }
      }, true);

      window.addEventListener("error", function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || "";
        if (isChannelClosedError(msg)) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === "function") {
            event.stopImmediatePropagation();
          }
        }
      }, true);

      var origConsoleError = console.error;
      console.error = function() {
        for (var i = 0; i < arguments.length; i++) {
          var arg = arguments[i];
          var msg = (arg && (arg.message || arg.stack || String(arg))) || "";
          if (isChannelClosedError(msg)) {
            return;
          }
        }
        origConsoleError.apply(console, arguments);
      };
    })();
  </script>
  <!-- 生产级预编译 CSS（替代 398KB Tailwind 运行时编译器） -->

<body class="bg-slate-950 text-amber-950 overflow-hidden select-none m-0 p-0 w-screen h-screen flex items-center justify-center">

  <!-- 16:9 横屏游戏全屏主视口 -->
  <div id="game-app-viewport" class="relative w-screen h-screen bg-sky-400 overflow-hidden">
    <!-- 首屏静态加载骨架 (优化 LCP 与视觉感知) -->

      <p class="text-sky-100 font-bold mt-4 animate-pulse">正在加载游戏世界...</p>
    </div>
    <!-- 动态模块（横向大地图、五步学习流、绘本馆、游乐场、字卡库、家长中心）由 app.js 注入 -->
  </div>

  <!-- 移动端竖屏旋转提示遮罩 -->
  <div id="orientation-rotate-prompt" class="fixed inset-0 z-[999] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center text-white select-none hidden">
    <div class="w-24 h-24 mb-6 flex items-center justify-center animate-rotate-phone">
      <img src="assets/images/cathy_mascot.webp" class="w-20 h-20 rounded-full border-4 border-amber-300 shadow-2xl object-cover" alt="旋转提示" />
    </div>
    <h2 class="text-2xl font-black text-amber-300 mb-2">请旋转手机横屏体验</h2>
    <p class="text-xs text-white/70 max-w-xs leading-relaxed font-bold">
      《凯茜识字》专为 16:9 沉浸式游戏世界设计，横过来看更精彩哦～
    </p>
    <button id="btn-dismiss-rotate-prompt" class="mt-8 bg-white/20 hover:bg-white/30 text-white/90 text-xs font-black px-6 py-2 rounded-full border border-white/30 transition-all">
      保持竖屏体验
    </button>
  </div>

  <!-- 核心逻辑脚本 (带版本防缓存) -->
  <!-- [版本同步] 版本号与 src/utils/version.js 的 APP_VERSION 保持一致，升级时同步修改 -->
  <script type="module" src="src/app.js?v=2.8.2"></script>

  <!-- 统一版本号注入：从 version.js 读取 APP_VERSION 供运行时与 SW 注册使用 -->
  <script type="module">
    import { APP_VERSION } from "./src/utils/version.js";
    // 保存给下方 SW 注册使用（单一版本来源）
    window.__APP_VERSION = APP_VERSION;
    window.__CACHE_VERSION = `cathy-literacy-v${APP_VERSION.replace(/\./g, "-")}`;
  </script>

  <!-- PWA Service Worker 注册与自动热更新 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const v = window.__APP_VERSION || "2.7.3";
        navigator.serviceWorker.register("./sw.js?v=" + v).then((reg) => {
          reg.update();
        }).catch((err) => {
          console.log("ServiceWorker registration skipped:", err);
        });
      });
    }
  </script>
</body>
