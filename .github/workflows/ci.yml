name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          fail=0
          for f in $(find src tests tools -name "*.js" -o -name "*.mjs" | grep -v node_modules | grep -v "/cache/"); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Template-comment gate (acorn)
        run: node tools/_check_tpl_comments.mjs

      - name: Unit tests
        run: npm test
